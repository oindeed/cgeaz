name: tier0

# Tier 0: the checks every change must pass before anyone looks at a plan.
# No cloud credentials, no state, no OIDC: this runs on every push and PR from the
# first commit, long before the fork is armed in Lab 6. It is the rubric's IaC-quality
# floor (fmt, validate, tflint, checkov) plus the two things that auto-fail a capstone
# outright if they slip: stored secrets and a gate whose rules do not do what they claim.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Every action is pinned to a full commit SHA (tag in the trailing comment), and every
# downloaded binary is checked against its release checksum. A tag can be moved; a SHA
# cannot.

concurrency:
  group: tier0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # On failure, each unformatted file becomes an error annotation carrying its diff,
      # readable from the PR and the checks API without opening the raw log.
      - name: fmt (whole tree)
        run: |
          if terraform fmt -check -recursive stages/ > unformatted.txt; then
            echo "fmt clean"
            exit 0
          fi
          while read -r f; do
            d=$(terraform fmt -diff -check "$f" | head -c 4000 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error file=${f},title=terraform fmt::${d}"
          done < unformatted.txt
          exit 1

      - name: validate (every stage, no backend)
        run: |
          set -euo pipefail
          for d in stages/*/; do
            echo "::group::validate $d"
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

  tflint:
    name: tflint (azurerm ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.53.0

      - name: init plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: lint every stage
        run: |
          set -euo pipefail
          for d in stages/*/; do
            echo "::group::tflint $d"
            tflint --chdir="$d" --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
            echo "::endgroup::"
          done

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: install checkov
        run: pip install --quiet "checkov==3.2.*"

      # Every accepted finding is waived inline, next to the resource, with its reason.
      # A new finding with no waiver fails the build. See docs/CHECKOV-WAIVERS.md.
      - name: scan stages
        run: checkov --config-file .checkov.yaml

  gate-tests:
    name: gate rules (conftest verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install conftest (pinned + checksum)
        run: |
          set -euo pipefail
          curl -sSL -o conftest.tgz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          echo "620f41640d63bbde1646a108ce2816ba54c980466ceebb7e754dda2d508e8cd5  conftest.tgz" | sha256sum -c -
          tar xzf conftest.tgz conftest
          sudo mv conftest /usr/local/bin/

      - name: fmt + unit tests
        run: |
          conftest fmt --check policy/
          conftest verify --policy policy/

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan every commit, not just the tip

      - name: install gitleaks (pinned + checksum)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  functions:
    name: functions (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: byte-compile every function app
        run: python -m compileall -q functions/

      # Fakes stand in for ARM and Cosmos: no credentials, no network. Proves one sweep
      # writes both sources under one runId, the ledger records success and failure,
      # and the reports pin to the latest succeeded run.
      - name: unit tests
        run: |
          pip install --quiet -r functions/collect_assessments/requirements.txt \
            -r functions/reports/requirements.txt pytest
          python -m pytest -q tests/functions
