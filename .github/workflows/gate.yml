name: compliance-gate

# The pipeline enforces policy on your environment. This gate enforces policy on the
# pipeline. No governance change merges without passing the same kind of scrutiny the
# pipeline applies to everything else.

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC federation — no client secret stored in GitHub, nothing to rotate
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
  TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}
  TF_VAR_deployer_object_id: ${{ vars.DEPLOYER_OBJECT_ID }}

jobs:
  gate:
    # Runs only in forks that have been armed (Lab 6: labs/06-loop/arm-your-fork.sh).
    # The upstream GRCEngClub/cgeaz repo is deliberately NOT armed: on a public repo,
    # a pull_request OIDC subject matches PRs from any fork — arming upstream would
    # hand fork PRs a path toward the course subscription. Your fork, your identity,
    # your sandbox subscription only.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [01-foundation, 03-evidence-store, 04-reporting, 06-enforcement]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform validate + plan
        working-directory: stages/${{ matrix.stage }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=rg-grc-tfstate" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate"
          terraform validate
          terraform plan -input=false -out=tf.plan
          terraform show -json tf.plan > plan.json

      # conftest is installed from a pinned, checksum-verified release, not a third-party
      # action on a mutable ref. This job holds an Azure token; nothing unpinned runs in it.
      - name: install conftest (pinned + checksum)
        run: |
          set -euo pipefail
          V=0.56.0
          F=conftest_${V}_Linux_x86_64.tar.gz
          curl -sSLO "https://github.com/open-policy-agent/conftest/releases/download/v${V}/${F}"
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${V}/checksums.txt" \
            | grep " ${F}$" | sha256sum -c -
          tar xzf "$F" conftest && sudo mv conftest /usr/local/bin/

      - name: OPA gate (conftest)
        run: conftest test stages/${{ matrix.stage }}/plan.json --policy policy/
